
services:
  mysql:
    image: mysql:8.0
    container_name: community-library-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - add it to .env or set it as a Windows environment variable}
      MYSQL_DATABASE: community_library
    ports:
      # 3306 on this machine is used by the locally installed MySQL
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: community-library-keycloak
    # Keycloak listens on 8180 (8080 on this machine is used by Apache)
    # Starts empty: the realm, roles, client and users are created by hand in the admin console.
    # (To auto-create them instead: add --import-realm here and mount ./keycloak at /opt/keycloak/data/import)
    command: start-dev --http-port=8180 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is not set in .env}
    ports:
      - "8180:8180"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro

  app:
    build: .
    container_name: community-library-app
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/community_library
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/community-library
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://keycloak:8180}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-Welcome@123}
      TEMP_PASSWORD_VALIDITY_SECONDS: ${TEMP_PASSWORD_VALIDITY_SECONDS:-120}
      # Required in Docker: inside the app container "localhost" is the app itself,
      # so the signing keys are fetched from the keycloak container by name (same port 8180)
      KEYCLOAK_JWK_SET_URI: http://keycloak:8180/realms/community-library/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-community-library-app}
    ports:
      - "8085:8085"

volumes:
  mysql-data:
  keycloak-data:
