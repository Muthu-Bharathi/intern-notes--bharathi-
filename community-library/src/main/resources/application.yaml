spring:
  application:
    name: community-library

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/community_library}
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migrations
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate          # was "update"
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Token-oda "iss" claim idhoda match aaganum; signature Keycloak public keys (certs) vachu verify aagum
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/community-library}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}

app:
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:community-library}
    client-id: ${KEYCLOAK_CLIENT_ID:community-library-app}
    admin-username: ${KEYCLOAK_ADMIN:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:}
    # First-login password for new librarians / members when the request leaves "password" empty
    default-user-password: ${DEFAULT_USER_PASSWORD:Welcome@123}
    # The default password stops working if it is not changed within this many seconds
    temp-password-validity-seconds: ${TEMP_PASSWORD_VALIDITY_SECONDS:120}

springdoc:
  swagger-ui:
    oauth:
      client-id: ${app.keycloak.client-id}
      use-pkce-with-authorization-code-grant: true
      # Always show the Keycloak login form, even if the browser is already signed in (easy to switch users)
      additional-query-string-params:
        prompt: login

server:
  port: 8085
  error:
    # Show the reason in error responses, e.g. "role must be LIBRARIAN or MEMBER" (no stack traces)
    include-message: always
